[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflectogen"
version = "1.0.1"
description = "Physics-inspired and calibration-enabled reflectogram synthesis for low-strain pile integrity testing."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Bora Canbula", email = "bora.canbula@cbu.edu.tr" },
  { name = "Övünç Öztürk" },
  { name = "Vehbi Özacar" },
  { name = "Tuğba Özacar" }
]
keywords = [
  "low-strain pile integrity testing",
  "reflectogram",
  "synthetic data",
  "calibration",
  "pile integrity",
  "Python"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "numpy>=1.22",
  "Pillow>=9.0"
]

[project.urls]
Homepage = "https://github.com/canbula/ReflectoGen"
Repository = "https://github.com/canbula/ReflectoGen"
Issues = "https://github.com/canbula/ReflectoGen/issues"

[project.scripts]
reflectogen = "reflectogen:main"

[tool.setuptools]
py-modules = ["reflectogen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
